name: 'Streamarr portable release'

# Builds the portable GPL archives for Linux amd64, Linux arm64 and macOS arm64 that the
# Streamarr transcode worker pins, with the upstream build scripts unchanged. A tag v<upstream release>-streamarr.<revision> publishes
# them to that tag's GitHub release, created with the workflow token. A release made that way
# sends no release event, so the upstream publishing workflow, which needs upstream's deploy
# secrets, never runs here. Create releases only by pushing a tag.

on:
  pull_request:
    branches:
      - streamarr
  push:
    tags:
      - 'v*-streamarr.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: 'Build portable ${{ matrix.target }}-gpl'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            runner: ubuntu-latest
            build: ./build-linux-amd64 ./dist
            built: dist
          - target: linuxarm64
            runner: ubuntu-latest
            build: ./build-linux-arm64 ./dist
            built: dist
          - target: macarm64
            runner: macos-latest
            build: ./builder/buildmac.sh arm64
            built: builder/artifacts

    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        if: runner.os == 'macOS'
        uses: Homebrew/actions/setup-homebrew@2026.09.13.1

      - name: Prepare the macOS prefix
        if: runner.os == 'macOS'
        run: |
          sudo mkdir /opt/ffbuild
          sudo chmod 777 /opt/ffbuild

      - name: Build
        run: ${{ matrix.build }}

      # builder/images/base/git-mini-clone.sh records the revision of every clone, including one
      # whose recipe passes no revision (fftw3f), in the prefix that each stage copies into the
      # final image. Clones that do not use it (Implib.so on Linux, libpng in the macOS base)
      # keep their .git directory. Every record must name a full revision.
      - name: Record the resolved source revisions (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}-gpl:latest"
          docker run --rm "${image}" sh -c 'cat "$FFBUILD_PREFIX"/share/streamarr-build-sources/*.txt; for g in $(find / -xdev -name .git -type d 2>/dev/null); do d=${g%/.git}; printf "%s %s %s\n" "$d" "$(git -C "$d" config --get remote.origin.url)" "$(git -C "$d" rev-parse HEAD)"; done' \
            | sort > build-sources.txt
          cat build-sources.txt
          grep -q '^fftw3f ' build-sources.txt
          grep -q 'Implib.so ' build-sources.txt
          awk 'NF != 3 || $3 !~ /^[0-9a-f]{40}$/ { print "Bad record: " $0; bad = 1 } END { exit bad }' build-sources.txt

      - name: Record the resolved source revisions (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          {
            cat /opt/ffbuild/prefix/share/streamarr-build-sources/*.txt
            find builder/build -name .git -type d | while read -r g; do
              d="${g%/.git}"
              printf '%s %s %s\n' "${d#builder/build/}" "$(git -C "$d" config --get remote.origin.url)" "$(git -C "$d" rev-parse HEAD)"
            done
          } | sort -u > build-sources.txt
          cat build-sources.txt
          grep -q 'libpng' build-sources.txt
          awk 'NF != 3 || $3 !~ /^[0-9a-f]{40}$/ { print "Bad record: " $0; bad = 1 } END { exit bad }' build-sources.txt

      - name: Package the archive for the Streamarr release
        env:
          TARGET: ${{ matrix.target }}
          BUILT: ${{ matrix.built }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=("${BUILT}"/*_portable_"${TARGET}"-gpl.tar.xz)
          if [[ ${#built[@]} -ne 1 ]]; then
            echo "Expected exactly one ${TARGET}-gpl archive, found ${#built[@]}" >&2
            exit 1
          fi
          name="${built[0]##*/}"
          upstream_version="${name#*_}"
          upstream_version="${upstream_version%%_portable_*}"
          if [[ "${REF_TYPE}" == tag ]]; then
            release_version="${REF_NAME#v}"
            if [[ "${release_version}" != "${upstream_version}"-streamarr.* ]]; then
              echo "Tag ${REF_NAME} does not name the built upstream release ${upstream_version}" >&2
              exit 1
            fi
          else
            release_version="${upstream_version}-streamarr-g${SHA:0:12}"
          fi
          # The upstream archive holds only the binaries. A downloaded archive also needs FFmpeg's
          # license texts and the directions to its Corresponding Source.
          pkg="$(mktemp -d)"
          tar -xJf "${built[0]}" -C "${pkg}"
          mkdir "${pkg}/licenses"
          cp COPYING.GPLv2 COPYING.GPLv3 COPYING.LGPLv2.1 COPYING.LGPLv3 LICENSE.md "${pkg}/licenses/"
          cp -R streamarr/notices "${pkg}/licenses/components"
          cp build-sources.txt "${pkg}/BUILD-SOURCES.txt"
          cat > "${pkg}/SOURCE.txt" <<SOURCE
          streamarr-ffmpeg ${release_version} (portable ${TARGET}-gpl)

          These binaries are FFmpeg built from https://github.com/${GITHUB_REPOSITORY}
          at revision ${SHA}. That revision's source is the Corresponding Source: FFmpeg's
          source, the patch series in debian/patches (the streamarr- patches are Streamarr's
          changes) and the build recipes in builder/. Each recipe in builder/scripts.d names its
          bundled library's repository and exact revision. BUILD-SOURCES.txt names the revision
          that each clone without a pinned revision resolved to in this build. FFmpeg's license
          texts are in licenses/, and the bundled components' license texts and notices are in
          licenses/components/.
          SOURCE
          # Not "release": the upstream tree has a RELEASE file, and macOS ignores case.
          mkdir -p streamarr-release
          out="${PWD}/streamarr-release/streamarr-ffmpeg_${release_version}_portable_${TARGET}-gpl.tar.xz"
          (cd "${pkg}" && tar -cJf "${out}" *)
          # List once: grep -q in a pipe from tar stops reading early, and pipefail then reports
          # tar's write error as a missing member.
          members="$(tar -tJf "${out}")"
          for member in ffmpeg ffprobe SOURCE.txt BUILD-SOURCES.txt licenses/COPYING.GPLv3 licenses/LICENSE.md \
            licenses/components/openssl/LICENSE.txt licenses/components/x264/COPYING.txt; do
            if ! grep -qx "${member}" <<< "${members}"; then
              echo "${out##*/} lacks ${member}" >&2
              exit 1
            fi
          done
          if command -v sha256sum > /dev/null; then sha256=(sha256sum); else sha256=(shasum -a 256); fi
          (cd streamarr-release && "${sha256[@]}" "${out##*/}" > "${out##*/}.sha256")
          cat streamarr-release/*.sha256

      # Without streamarr-0001 this command never finishes: the stream copy of input 1's audio
      # is that stream's first destination and hides the filter graph behind its decoder from
      # the scheduler. linuxarm64 binaries cannot run on these runners.
      - name: Check that the scheduler unchokes every destination
        if: matrix.target != 'linuxarm64'
        run: |
          set -euo pipefail
          bin="$(mktemp -d)"
          tar -xJf streamarr-release/*.tar.xz -C "${bin}" ffmpeg
          source='testsrc2=s=160x120:r=24:d=4[out0];sine=r=48000:d=120[out1]'
          graph='[0:v]tpad=stop=-1:stop_mode=clone,trim=end=120[v];aevalsrc=0:d=0.1[z];[1:a][z]amix=inputs=2:duration=first[a]'
          perl -e 'alarm shift; exec @ARGV' 120 "${bin}/ffmpeg" -nostdin -v error \
            -f lavfi -i "${source}" -f lavfi -i "${source}" -filter_complex "${graph}" \
            -map '[v]' -map '[a]' -c:v rawvideo -c:a pcm_s16le -f null - \
            -map 1:a -c copy -f null - \
            -map 1:v -c copy -f null -

      # streamarr-0004 adds the agapfill filter. streamarr-0005 makes the filter of a graph that
      # ffmpeg rebuilds mid-stream continue the output of the graph before it. Without it the
      # leading silence is written twice, a gap at the rebuild stays a hole, and a rebuild while
      # the filter writes silence loses samples. The check makes its sources with lavfi and
      # compares every output sample with the timeline the filter's rules give. linuxarm64
      # binaries cannot run on these runners.
      - name: Check that agapfill fills gaps and keeps every sample
        if: matrix.target != 'linuxarm64'
        run: |
          set -euo pipefail
          bin="$(mktemp -d)"
          tar -xJf streamarr-release/*.tar.xz -C "${bin}" ffmpeg
          python3 streamarr/tests/agapfill.py --ffmpeg "${bin}/ffmpeg"

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.target }}-gpl
          path: streamarr-release
          if-no-files-found: error

  publish:
    name: 'Publish the Streamarr release'
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: streamarr-release
          merge-multiple: true

      - name: Publish the archives as the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd streamarr-release
          expected="$(ls *.tar.xz *.sha256 | sort)"
          if [[ "$(ls *.tar.xz | wc -l)" -ne 3 ]]; then
            echo "Expected 3 archives" >&2
            exit 1
          fi
          sha256sum -c *.sha256

          # A published release keeps its assets: the worker may already pin their digests.
          # Rebuilt archives differ byte for byte, so a retry after publication only checks
          # that the release is complete. Changed archives need a new Streamarr revision.
          # Assets are replaced only on a release confirmed to be a draft; an unknown state stops.
          release_state() {
            local out
            if out="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2> state.err)"; then
              case "${out}" in
                true) echo draft ;;
                false) echo published ;;
                *) echo "Unexpected release state '${out}'" >&2; return 1 ;;
              esac
            elif grep -q 'release not found' state.err; then
              echo missing
            else
              cat state.err >&2
              return 1
            fi
          }

          state="$(release_state)"
          if [[ "${state}" == published ]]; then
            published="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
            if [[ "${published}" != "${expected}" ]]; then
              echo "Release ${TAG} is published without the expected assets; tag a new Streamarr revision" >&2
              exit 1
            fi
            echo "Release ${TAG} is already published with every asset; nothing to do"
            exit 0
          fi

          if [[ "${state}" == missing ]]; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --title "${TAG}" \
              --notes "Portable GPL builds of ${TAG} for Linux amd64, Linux arm64 and macOS arm64: the upstream release plus the streamarr- patches at the end of debian/patches/series. Corresponding Source: the source of this tag, which holds FFmpeg's source, the patch series in debian/patches and the build recipes in builder/. Each recipe in builder/scripts.d names its bundled library's repository and exact revision, and each archive's BUILD-SOURCES.txt names the revision of every clone that the recipes leave unpinned. Each archive carries SOURCE.txt, FFmpeg's license texts and the bundled components' license texts and notices."
          fi
          if [[ "$(release_state)" != draft ]]; then
            echo "Release ${TAG} is not a confirmed draft; its assets stay unchanged" >&2
            exit 1
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber *.tar.xz *.sha256
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir ../verify --pattern '*'
          (cd ../verify && sha256sum -c *.sha256)
          if [[ "$(ls ../verify | sort)" != "${expected}" ]]; then
            echo "The draft release holds other assets than the build" >&2
            exit 1
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
